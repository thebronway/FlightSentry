services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flightsentry_web
    command: npm run start
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - PORT=4000

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flightsentry_worker
    command: npm run worker
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=UTC
    depends_on:
      - web